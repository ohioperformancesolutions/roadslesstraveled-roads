name: Build road files

# Builds one road file per county from Geofabrik's OpenStreetMap state extracts and publishes them as
# release downloads (one release per state, tag roads-<state>). Runs on the 2nd of every month, or by hand.
on:
  workflow_dispatch:
    inputs:
      states:
        description: 'States to build, comma-separated (e.g. missouri,new-york), or "all"'
        default: all
  schedule:
    - cron: '23 7 2 * *'

permissions:
  contents: write

concurrency:
  group: build-roads
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.p.outputs.states }}
    steps:
      - id: p
        env:
          IN: ${{ github.event.inputs.states || 'all' }}
        run: |
          ALL='["missouri","alabama","alaska","arizona","arkansas","california","colorado","connecticut","delaware","district-of-columbia","florida","georgia","hawaii","idaho","illinois","indiana","iowa","kansas","kentucky","louisiana","maine","maryland","massachusetts","michigan","minnesota","mississippi","montana","nebraska","nevada","new-hampshire","new-jersey","new-mexico","new-york","north-carolina","north-dakota","ohio","oklahoma","oregon","pennsylvania","rhode-island","south-carolina","south-dakota","tennessee","texas","utah","vermont","virginia","washington","west-virginia","wisconsin","wyoming"]'
          if [ "$IN" = all ]; then
            echo "states=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "states=$(printf '%s' "$IN" | jq -Rc 'split(",") | map(gsub("^ +| +$"; "") | ascii_downcase | gsub(" "; "-"))')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state: ${{ fromJson(needs.plan.outputs.states) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && osmium --version | head -1
      - name: Test
        run: node scripts/test.mjs
      - name: Download ${{ matrix.state }} from Geofabrik
        run: curl -fsSL --retry 5 --retry-delay 30 -o state.osm.pbf "https://download.geofabrik.de/north-america/us/${{ matrix.state }}-latest.osm.pbf" && ls -lh state.osm.pbf
      - name: Build county files
        run: |
          NAME=$(printf '%s' "${{ matrix.state }}" | sed 's/-/ /g' | awk '{for (i = 1; i <= NF; i++) $i = toupper(substr($i, 1, 1)) substr($i, 2)} 1')
          node scripts/build.mjs state.osm.pbf out "$NAME"
          du -sh out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish.sh "roads-${{ matrix.state }}"
